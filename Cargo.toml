[package]
name = "caixa-visao-computacional"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
libloading = "=0.9.0"
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-msmf"] }
openvino = { version = "=0.11.1", features = ["runtime-linking"] }
openvino-sys = { version = "=0.11.1", features = ["runtime-linking"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
windows = { version = "=0.62.2", features = ["Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
